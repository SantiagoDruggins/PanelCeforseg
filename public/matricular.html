<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Matricular Estudiante - CEFORSEG</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.camera-box{
  position:relative;
  width:100%;
  padding-top:133%;
  background:#000;
  border-radius:10px;
  overflow:hidden;
  border:2px solid #0a3b78;
}
.camera-box video,
.camera-box img{
  position:absolute;
  top:0;left:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
</style>
</head>

<body>

<script>
if(!localStorage.getItem('token')){
  location.href='/login';
}
</script>

<div id="app"></div>

<script src="/permisos.js"></script>
<script>
if (bloquearModuloAliado('Matricular')) throw new Error('Acceso aliado bloqueado');
const token = localStorage.getItem('token');

fetch('/layout.html')
  .then(r=>r.text())
  .then(html=>{
    document.getElementById('app').innerHTML = html;
    aplicarPermisosPanel();
    const content = document.querySelector('.content');

    content.innerHTML = `
      <h3 class="mb-4">📸 Matricular Estudiante</h3>

      <form id="formMatricula" enctype="multipart/form-data">

        <div class="row g-3">

          <div class="col-md-8">
            <div class="card shadow-sm">
              <div class="card-body">

                <div class="row g-2">
                  <div class="col-md-6">
                    <input class="form-control" name="nombre" placeholder="Nombre completo" required>
                  </div>
                  <div class="col-md-6">
                    <input class="form-control" name="cedula" placeholder="Cédula" required>
                  </div>
                  <div class="col-md-6">
                    <input class="form-control" name="telefono" placeholder="Teléfono">
                  </div>
                  <div class="col-md-6">
                    <input class="form-control" name="email" type="email" placeholder="Correo electrónico">
                  </div>
                  <div class="col-md-6">
                    <input class="form-control" name="ciudad" placeholder="Ciudad">
                  </div>
                  <div class="col-md-6">
                    <input class="form-control" name="fecha_matricula" type="date" placeholder="Fecha matrícula" title="Fecha de matrícula">
                  </div>
                  <div class="col-12">
                    <input class="form-control" name="direccion" placeholder="Dirección">
                  </div>
                  <div class="col-12">
                    <input class="form-control" name="contacto_emergencia" placeholder="En caso de accidente llamar a (nombre y teléfono)">
                  </div>
                </div>

                <hr>
                <h6 class="mb-2">📚 Cursos a matricular</h6>
                <div id="listaCursos" class="ms-2"></div>

                <hr>
                <h6 class="mb-2">Pago inicial / abono de matricula</h6>
                <p class="text-muted small mb-2">Si entra dinero en la matricula, se genera factura POS automatica.</p>
                <div class="row g-2">
                  <div class="col-md-4">
                    <input class="form-control" id="abonoInicialValor" type="number" min="0" placeholder="Valor pagado">
                  </div>
                  <div class="col-md-4">
                    <select class="form-select" id="abonoInicialCurso">
                      <option value="">Curso del pago</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <select class="form-select" id="abonoInicialMetodo">
                      <option value="efectivo">Efectivo</option>
                      <option value="nequi">Nequi</option>
                      <option value="Daviplata">Daviplata</option>
                      <option value="Bancolombia">Transferencia - Bancolombia</option>
                      <option value="Otro banco">Transferencia - Otro banco</option>
                    </select>
                  </div>
                </div>

              </div>
            </div>
          </div>

          <div class="col-md-4">
            <div class="card shadow-sm">
              <div class="card-body text-center">

                <div class="camera-box mb-2">
                  <video id="video" autoplay></video>
                  <img id="preview" class="d-none">
                </div>

                <button type="button" class="btn btn-warning w-100 mb-2" onclick="tomarFoto()">
                  📷 Tomar foto
                </button>

                <input type="file" name="foto" id="foto" class="d-none">
                <div class="text-danger small d-none" id="msgFoto">
                  ⚠️ La foto es obligatoria
                </div>

              </div>
            </div>
          </div>

        </div>

        <button class="btn btn-primary w-100 mt-4">
          ✅ Matricular Estudiante
        </button>

      </form>
    `;

    iniciarCamara();
    cargarCursos();
    registrarSubmit();
  });

/* 🎥 Cámara */
function iniciarCamara(){
  const v = document.getElementById('video');
  navigator.mediaDevices.getUserMedia({ video:true })
    .then(stream => v.srcObject = stream)
    .catch(()=>alert('No se pudo acceder a la cámara'));
}

/* 📸 Foto */
function tomarFoto(){
  const v = document.getElementById('video');
  const canvas = document.createElement('canvas');
  canvas.width = v.videoWidth;
  canvas.height = v.videoHeight;
  canvas.getContext('2d').drawImage(v,0,0);

  canvas.toBlob(blob=>{
    const file = new File([blob],'foto.jpg',{type:'image/jpeg'});
    const dt = new DataTransfer();
    dt.items.add(file);
    document.getElementById('foto').files = dt.files;

    const img = document.getElementById('preview');
    img.src = URL.createObjectURL(blob);
    img.classList.remove('d-none');
    document.getElementById('msgFoto').classList.add('d-none');
  });
}

/* 📚 Cursos (CHECKBOX) */
async function cargarCursos(){
  const res = await fetch('/api/cursos',{
    headers:{ Authorization:'Bearer '+token }
  });
  const cursos = await res.json();
  const cont = document.getElementById('listaCursos');
  const selectAbono = document.getElementById('abonoInicialCurso');

  cursos.forEach(c=>{
    cont.innerHTML += `
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="curso_ids[]" value="${c.id}" id="curso_${c.id}">
        <label class="form-check-label" for="curso_${c.id}">
          ${c.nombre} - ${typeof formatCOP === 'function' ? formatCOP(c.precio) : '$' + Number(c.precio).toLocaleString('es-CO') + ' COP'}
        </label>
      </div>
    `;
    if(selectAbono){
      selectAbono.innerHTML += `<option value="${c.id}">${c.nombre}</option>`;
    }
  });
}

/* 🚀 Submit */
function mostrarResultadoMatricula(estudianteId, facturaId){
  const content = document.querySelector('.content') || document.getElementById('app');
  content.innerHTML = `
    <div class="card shadow-sm mx-auto" style="max-width:720px;">
      <div class="card-body text-center p-4">
        <h3 class="mb-2">Matricula registrada</h3>
        <p class="text-muted mb-4">Antes de salir, imprime los documentos necesarios.</p>
        <div class="d-grid gap-2">
          <button class="btn btn-primary btn-lg" onclick="window.open('/ficha-imprimir?id=${estudianteId}', '_blank', 'width=900,height=800')">
            Imprimir acta de matricula
          </button>
          ${facturaId ? `
          <button class="btn btn-success btn-lg" onclick="window.open('/factura-pos.html?id=${facturaId}', '_blank', 'width=420,height=720')">
            Imprimir factura POS
          </button>
          ` : ''}
          <a class="btn btn-outline-secondary btn-lg" href="/estudiante-ficha?id=${estudianteId}">
            Abrir ficha del alumno
          </a>
          <a class="btn btn-outline-dark" href="/matricular">
            Registrar otra matricula
          </a>
          <a class="btn btn-link" href="/estudiantes-panel">
            Volver a estudiantes
          </a>
        </div>
      </div>
    </div>
  `;
}
function registrarSubmit(){
  document.getElementById('formMatricula').addEventListener('submit', async e=>{
    e.preventDefault();

    if(!document.getElementById('foto').files.length){
      document.getElementById('msgFoto').classList.remove('d-none');
      return;
    }

    const abonoInicial = Number(document.getElementById('abonoInicialValor').value || 0);
    const cursoAbonoInicial = document.getElementById('abonoInicialCurso').value;
    if(abonoInicial > 0 && !cursoAbonoInicial){
      alert('Seleccione el curso al que aplica el pago inicial');
      return;
    }
    if(abonoInicial > 0){
      const cursoMarcado = document.querySelector(`input[name="curso_ids[]"][value="${cursoAbonoInicial}"]`);
      if(!cursoMarcado || !cursoMarcado.checked){
        alert('El curso del pago inicial tambien debe estar marcado en la matricula');
        return;
      }
    }

    const formData = new FormData(e.target);

    const res = await fetch('/api/estudiantes',{
      method:'POST',
      headers:{ Authorization:'Bearer '+token },
      body:formData
    });

    const data = await res.json();
    if(!res.ok){
      alert(data.mensaje || 'No se pudo registrar la matricula');
      return;
    }
    let facturaId = null;
    if (data.id && abonoInicial > 0) {
      const pagoRes = await fetch('/api/abonos',{
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':'Bearer '+token
        },
        body: JSON.stringify({
          estudiante_id: data.id,
          curso_id: cursoAbonoInicial,
          valor: abonoInicial,
          metodo_pago: document.getElementById('abonoInicialMetodo').value,
          nota: 'Pago inicial en matricula',
          fecha: formData.get('fecha_matricula') || new Date().toISOString().slice(0, 10)
        })
      });
      const pagoData = await pagoRes.json();
      if(!pagoRes.ok){
        alert(pagoData.mensaje || 'Estudiante creado, pero no se pudo facturar el pago inicial');
      }else if(pagoData.factura && pagoData.factura.id){
        facturaId = pagoData.factura.id;
      }
    }
    if (data.id) {
      mostrarResultadoMatricula(data.id, facturaId);
      return;
    }
  });
}
</script>

</body>
</html>

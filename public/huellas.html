<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Huella digital - CEFORSEG</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<style>
.maintenance-wrap{
  max-width:760px;
  margin:40px auto;
}
.maintenance-icon{
  width:96px;
  height:96px;
  border-radius:50%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#eef2f7;
  color:#64748b;
  font-size:48px;
}
</style>
</head>

<body>
<script>
if(!localStorage.getItem('token')) location.href='/login';
</script>

<div id="app"></div>

<script src="/permisos.js"></script>
<script>
if (bloquearModuloAliado('Buscar por huella')) throw new Error('Acceso aliado bloqueado');

fetch('/layout.html')
  .then(r => r.text())
  .then(html => {
    document.getElementById('app').innerHTML = html;
    aplicarPermisosPanel();
    document.querySelector('.content').innerHTML = `
      <div class="maintenance-wrap">
        <div class="card shadow-sm border-0">
          <div class="card-body text-center p-5">
            <div class="maintenance-icon mb-4">
              <i class="bi bi-fingerprint"></i>
            </div>
            <span class="badge bg-secondary mb-3">En mantenimiento</span>
            <h3 class="fw-bold mb-3">Huella digital</h3>
            <p class="text-muted mb-4">
              Estamos terminando la integración del huellero ZK9500.
              Esta función estará disponible próximamente.
            </p>
            <div class="d-flex justify-content-center gap-2 flex-wrap">
              <a class="btn btn-primary" href="/matricular">
                <i class="bi bi-plus-circle me-1"></i>Ir a matrícula
              </a>
              <a class="btn btn-outline-secondary" href="/estudiantes-panel">
                <i class="bi bi-people me-1"></i>Ver estudiantes
              </a>
            </div>
          </div>
        </div>
      </div>
    `;
  });
</script>
</body>
</html>

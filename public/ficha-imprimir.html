<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ficha de matricula - DENVER LTDA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: #d7d9dd;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }
    .no-print {
      max-width: 216mm;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .no-print a, .no-print button {
      border: 1px solid #0a3b78;
      background: #fff;
      color: #0a3b78;
      padding: 9px 12px;
      border-radius: 6px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .no-print button {
      background: #0a3b78;
      color: #fff;
    }
    .sheet {
      width: 216mm;
      min-height: 279mm;
      margin: 0 auto;
      padding: 12mm;
      background: #fff;
      border: 2px solid #111;
      box-shadow: 0 2px 14px rgba(0,0,0,.24);
    }
    .header {
      display: grid;
      grid-template-columns: 30mm 1fr 38mm;
      gap: 8mm;
      align-items: start;
      border-bottom: 2px solid #111;
      padding-bottom: 7mm;
    }
    .logo {
      width: 25mm;
      height: 25mm;
      object-fit: contain;
    }
    .title {
      text-align: center;
      text-transform: uppercase;
    }
    .title .school {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.25;
    }
    .title .name {
      margin-top: 3mm;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0;
    }
    .title .nit {
      margin-top: 2mm;
      font-size: 12px;
      font-weight: 700;
    }
    .photo-box {
      width: 35mm;
      height: 45mm;
      border: 1.5px solid #111;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 11px;
      text-align: center;
      color: #555;
    }
    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .meta {
      margin-top: 6mm;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border: 1.5px solid #111;
      border-bottom: 0;
    }
    .field {
      min-height: 12mm;
      border-right: 1.5px solid #111;
      border-bottom: 1.5px solid #111;
      padding: 2mm 2.5mm;
    }
    .field:nth-child(3n) { border-right: 0; }
    .label {
      display: block;
      margin-bottom: 1.5mm;
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .value {
      font-size: 13px;
      font-weight: 600;
      word-break: break-word;
    }
    .wide { grid-column: span 2; }
    .full { grid-column: 1 / -1; }
    .section-title {
      margin: 7mm 0 2.5mm;
      padding: 2mm 3mm;
      background: #111;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      border: 1.4px solid #111;
      padding: 2.5mm;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #f0f1f3;
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 900;
    }
    .right { text-align: right; }
    .summary {
      margin-top: 4mm;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1.5px solid #111;
      border-right: 0;
    }
    .summary .box {
      padding: 3mm;
      border-right: 1.5px solid #111;
      text-align: center;
    }
    .summary .box span {
      display: block;
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .summary .box strong {
      display: block;
      margin-top: 1mm;
      font-size: 16px;
    }
    .signatures {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18mm;
      margin-top: 18mm;
    }
    .sig {
      border-top: 1.5px solid #111;
      padding-top: 2mm;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
    }
    .footer {
      margin-top: 8mm;
      font-size: 9px;
      text-align: center;
      color: #333;
    }
    @media print {
      body { padding: 0; background: #fff; }
      .no-print { display: none !important; }
      .sheet {
        width: 216mm;
        min-height: 279mm;
        margin: 0;
        box-shadow: none;
        border: 2px solid #111;
      }
      @page { size: letter; margin: 0; }
    }
  </style>
</head>
<body>
  <div class="no-print">
    <a href="#" id="btnVolver">Volver a ficha</a>
    <button type="button" onclick="window.print()">Imprimir ficha de matricula</button>
    <span id="msgCarga"></span>
  </div>

  <main class="sheet" id="sheet">
    <div id="contenido">Cargando ficha...</div>
  </main>

<script src="/permisos.js"></script>
<script>
(function() {
  if (!localStorage.getItem('token')) { location.href = '/login'; return; }
  if (bloquearModuloAliado('Ficha de matricula')) return;

  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const token = localStorage.getItem('token');
  const msg = document.getElementById('msgCarga');
  const contenido = document.getElementById('contenido');

  if (!id) {
    contenido.textContent = 'Falta id del estudiante. Use: /ficha-imprimir?id=123';
    return;
  }

  document.getElementById('btnVolver').href = '/estudiante-ficha?id=' + id;

  function escapeHtml(value){
    return String(value == null || value === '' ? '-' : value)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function formatCOP(n){
    return '$' + Number(n || 0).toLocaleString('es-CO') + ' COP';
  }

  function fechaCorta(value){
    if(!value) return '-';
    const raw = String(value);
    const d = raw.length === 10 ? new Date(raw + 'T12:00:00') : new Date(raw);
    if(Number.isNaN(d.getTime())) return raw.slice(0, 10);
    return d.toLocaleDateString('es-CO', { year:'numeric', month:'2-digit', day:'2-digit' });
  }

  function renderCursos(cursos){
    if(!cursos || !cursos.length){
      return '<tr><td colspan="4">Sin cursos matriculados</td></tr>';
    }
    return cursos.map(c => `
      <tr>
        <td>${escapeHtml(c.nombre)}</td>
        <td class="right">${formatCOP(c.precio)}</td>
        <td class="right">${formatCOP(Number(c.precio || 0) - Number(c.saldo || 0))}</td>
        <td class="right">${formatCOP(c.saldo)}</td>
      </tr>
    `).join('');
  }

  function renderPagos(abonos){
    if(!abonos || !abonos.length){
      return '<tr><td colspan="5">Sin pagos registrados</td></tr>';
    }
    return abonos.map(a => `
      <tr>
        <td>${fechaCorta(a.fecha)}</td>
        <td>${escapeHtml(a.numero_factura || '-')}</td>
        <td>${escapeHtml(a.curso || '-')}</td>
        <td>${escapeHtml(a.metodo_pago || 'efectivo')}</td>
        <td class="right">${formatCOP(a.valor)}</td>
      </tr>
    `).join('');
  }

  Promise.all([
    fetch('/api/estudiantes/' + id, { headers: { Authorization: 'Bearer ' + token } }).then(r => r.json()),
    fetch('/api/abonos/' + id, { headers: { Authorization: 'Bearer ' + token } }).then(r => r.json())
  ])
    .then(([e, abonos]) => {
      if (!e.id) {
        contenido.textContent = 'Estudiante no encontrado';
        return;
      }

      const cursos = e.cursos || [];
      const pagos = Array.isArray(abonos) ? abonos : [];
      const totalCursos = cursos.reduce((sum, c) => sum + Number(c.precio || 0), 0);
      const saldoTotal = cursos.reduce((sum, c) => sum + Number(c.saldo || 0), 0);
      const totalPagado = pagos.reduce((sum, a) => sum + Number(a.valor || 0), 0);
      const foto = e.foto
        ? `<img src="${escapeHtml(e.foto)}" alt="Foto del alumno">`
        : 'Foto del alumno';

      contenido.innerHTML = `
        <header class="header">
          <div>
            <img class="logo" src="/assets/logo-denver.png" alt="Denver LTDA">
          </div>
          <div class="title">
            <div class="school">Escuela de capacitacion en vigilancia y seguridad privada</div>
            <div class="name">DENVER LTDA</div>
            <div class="nit">NIT 901156976-1</div>
            <div class="name" style="font-size:19px;margin-top:5mm;">Acta de matricula</div>
          </div>
          <div class="photo-box">${foto}</div>
        </header>

        <section class="meta">
          <div class="field"><span class="label">Fecha matricula</span><div class="value">${fechaCorta(e.fecha_matricula)}</div></div>
          <div class="field"><span class="label">Codigo alumno</span><div class="value">#${escapeHtml(e.id)}</div></div>
          <div class="field"><span class="label">Estado</span><div class="value">${escapeHtml(e.estado || 'activo')}</div></div>

          <div class="field wide"><span class="label">Nombres y apellidos</span><div class="value">${escapeHtml(e.nombre)}</div></div>
          <div class="field"><span class="label">Cedula</span><div class="value">${escapeHtml(e.cedula)}</div></div>

          <div class="field"><span class="label">Telefono</span><div class="value">${escapeHtml(e.telefono)}</div></div>
          <div class="field"><span class="label">Ciudad</span><div class="value">${escapeHtml(e.ciudad)}</div></div>
          <div class="field"><span class="label">Correo electronico</span><div class="value">${escapeHtml(e.email)}</div></div>

          <div class="field wide"><span class="label">Direccion de residencia</span><div class="value">${escapeHtml(e.direccion)}</div></div>
          <div class="field"><span class="label">Contacto emergencia</span><div class="value">${escapeHtml(e.contacto_emergencia)}</div></div>
        </section>

        <div class="section-title">Cursos matriculados</div>
        <table>
          <thead>
            <tr>
              <th>Curso</th>
              <th class="right">Valor</th>
              <th class="right">Pagado</th>
              <th class="right">Saldo</th>
            </tr>
          </thead>
          <tbody>${renderCursos(cursos)}</tbody>
        </table>

        <div class="section-title">Pagos / abonos registrados</div>
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Factura</th>
              <th>Curso</th>
              <th>Metodo</th>
              <th class="right">Valor</th>
            </tr>
          </thead>
          <tbody>${renderPagos(pagos)}</tbody>
        </table>

        <section class="summary">
          <div class="box"><span>Valor matriculado</span><strong>${formatCOP(totalCursos)}</strong></div>
          <div class="box"><span>Total pagado</span><strong>${formatCOP(totalPagado)}</strong></div>
          <div class="box"><span>Saldo pendiente</span><strong>${formatCOP(saldoTotal)}</strong></div>
        </section>

        <section class="signatures">
          <div class="sig">Firma del alumno / acudiente</div>
          <div class="sig">Firma funcionario autorizado</div>
        </section>

        <footer class="footer">
          Ficha generada desde el sistema con los datos registrados del alumno. Todo pago debe tener factura consecutiva.
        </footer>
      `;
      msg.textContent = 'Ficha lista para imprimir.';
    })
    .catch(() => {
      contenido.textContent = 'Error al cargar datos de la ficha';
    });
})();
</script>
</body>
</html>
